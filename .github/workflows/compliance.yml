name: GameHub Legal Compliance & Build Gate

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  compliance-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Legal Game Importer
        run: npm run import-games

      - name: Run Strict Compliance Validator
        run: npm run validate-games

      - name: Build Next.js Production App
        run: npm run build
