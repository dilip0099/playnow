name: PlayNow Build Gate

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      # Builds against the already-committed src/data/games.json snapshot rather than
      # `npm run build` (which re-fetches the live GamePix feed) — a PR/push gate should
      # validate the code, not depend on network access or the GAMEPIX_SID secret, which
      # isn't available to workflows triggered from forked-repo pull requests anyway.
      - name: Build Next.js production app
        run: npx next build
