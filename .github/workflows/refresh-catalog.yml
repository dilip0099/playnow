name: Weekly GamePix Catalog Refresh

on:
  schedule:
    # Every Monday 06:00 UTC — matches GamePix's own "new games every week" cadence.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Refresh catalog from GamePix
        env:
          GAMEPIX_SID: ${{ secrets.GAMEPIX_SID }}
        run: npm run import-gamepix

      - name: Verify the refreshed catalog still builds
        run: npx next build

      - name: Commit updated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/games.json src/data/license-report.json public/license-report.json ATTRIBUTIONS.md
          git diff --cached --quiet || git commit -m "chore: weekly GamePix catalog refresh"
          git push
