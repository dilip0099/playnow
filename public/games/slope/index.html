<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Slope 3D - PlayThorn Classic</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background: #0b0f19; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; overflow: hidden; }
    #canvas-container { width: 100vw; height: 100vh; display: block; }
    #ui {
      position: absolute; top: 20px; left: 20px; z-index: 10;
      font-size: 24px; font-weight: 800; text-shadow: 0 0 10px rgba(0,255,204,0.8);
      background: rgba(11, 15, 25, 0.7); padding: 12px 24px; border-radius: 12px;
      border: 1px solid rgba(0,255,204,0.3); backdrop-filter: blur(8px);
    }
    #game-over {
      display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(11, 15, 25, 0.9); z-index: 20;
      flex-direction: column; align-items: center; justify-content: center;
      backdrop-filter: blur(12px);
    }
    #game-over h1 { font-size: 48px; color: #ff0055; text-shadow: 0 0 20px rgba(ff,0,85,0.8); margin-bottom: 10px; }
    #game-over p { font-size: 22px; color: #aaa; margin-bottom: 24px; }
    .btn {
      background: linear-gradient(135deg, #00ffcc, #0099ff); color: #000; font-weight: 900;
      font-size: 18px; padding: 14px 36px; border: none; border-radius: 30px; cursor: pointer;
      box-shadow: 0 0 20px rgba(0,255,204,0.5); transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(0,255,204,0.8); }
    #controls-hint {
      position: absolute; bottom: 20px; width: 100%; text-align: center; color: rgba(255,255,255,0.6);
      font-size: 14px; pointer-events: none;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.min.js" onerror="window.threeFailed=true"></script>
</head>
<body>
  <div id="ui">SCORE: <span id="score">0</span></div>
  <div id="canvas-container"></div>
  <div id="controls-hint">Use ⬅️ ➡️ Arrow Keys or A / D or Touch Left/Right to Steer Ball</div>

  <div id="game-over">
    <h1>GAME OVER</h1>
    <p>FINAL SCORE: <span id="final-score">0</span></p>
    <button class="btn" onclick="resetGame()">PLAY AGAIN</button>
  </div>

  <script>
    // Fallback if CDN fails
    if (typeof THREE === 'undefined') {
      document.body.innerHTML = '<h2 style="color:white;text-align:center;margin-top:20%;">Loading 3D Slope Engine...</h2>';
      setTimeout(() => location.reload(), 1500);
    }

    let scene, camera, renderer, ball, tiles = [], obstacles = [];
    let score = 0, speed = 0.6, ballX = 0, isGameOver = false;
    let moveLeft = false, moveRight = false;

    function init() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0b0f19);
      scene.fog = new THREE.FogExp2(0x0b0f19, 0.015);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      // Lights
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0x00ffcc, 0.8);
      dirLight.position.set(10, 20, 10);
      scene.add(dirLight);

      // Ball
      const ballGeo = new THREE.SphereGeometry(0.8, 32, 32);
      const ballMat = new THREE.MeshPhongMaterial({
        color: 0x00ffcc,
        emissive: 0x005544,
        shininess: 100,
        wireframe: false
      });
      ball = new THREE.Mesh(ballGeo, ballMat);
      ball.position.set(0, 0.8, 0);
      scene.add(ball);

      // Build Initial Track
      for (let i = 0; i < 40; i++) {
        spawnTile(i * -5);
      }

      // Event Listeners
      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') moveLeft = true;
        if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') moveRight = true;
      });

      window.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') moveLeft = false;
        if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') moveRight = false;
      });

      // Touch Controls
      window.addEventListener('touchstart', (e) => {
        const x = e.touches[0].clientX;
        if (x < window.innerWidth / 2) moveLeft = true;
        else moveRight = true;
      });
      window.addEventListener('touchend', () => { moveLeft = false; moveRight = false; });

      window.addEventListener('resize', onWindowResize);

      animate();
    }

    function spawnTile(zPos) {
      const tileWidth = 10;
      const tileLength = 5;
      const tileGeo = new THREE.BoxGeometry(tileWidth, 0.4, tileLength);
      const tileMat = new THREE.MeshPhongMaterial({
        color: 0x151d30,
        emissive: 0x080b14,
        specular: 0x00ffcc
      });
      const tile = new THREE.Mesh(tileGeo, tileMat);
      tile.position.set(0, 0, zPos);
      scene.add(tile);
      tiles.push(tile);

      // Random Red Obstacle (don't place on first 5 tiles)
      if (Math.abs(zPos) > 25 && Math.random() < 0.45) {
        const obsWidth = 1.6;
        const obsGeo = new THREE.BoxGeometry(obsWidth, 1.6, 1.6);
        const obsMat = new THREE.MeshPhongMaterial({ color: 0xff0055, emissive: 0x880022 });
        const obs = new THREE.Mesh(obsGeo, obsMat);
        const posX = (Math.random() - 0.5) * (tileWidth - 3);
        obs.position.set(posX, 1.0, zPos);
        scene.add(obs);
        obstacles.push(obs);
      }
    }

    function animate() {
      if (isGameOver) return;
      requestAnimationFrame(animate);

      // Ball Movement
      ball.position.z -= speed;
      speed += 0.00015; // Gradually increase speed

      if (moveLeft && ball.position.x > -4.2) ball.position.x -= 0.18;
      if (moveRight && ball.position.x < 4.2) ball.position.x += 0.18;

      ball.rotation.x -= speed * 0.5;

      // Camera Follow
      camera.position.set(ball.position.x * 0.4, ball.position.y + 2.5, ball.position.z + 6);
      camera.lookAt(ball.position.x * 0.2, ball.position.y, ball.position.z - 5);

      // Update Score
      score = Math.floor(Math.abs(ball.position.z));
      document.getElementById('score').innerText = score;

      // Spawn Endless Tiles
      const lastTileZ = tiles[tiles.length - 1].position.z;
      if (ball.position.z < lastTileZ + 150) {
        spawnTile(lastTileZ - 5);
      }

      // Check Fall off edge
      if (Math.abs(ball.position.x) > 4.8) {
        ball.position.y -= 0.3;
        if (ball.position.y < -5) triggerGameOver();
      }

      // Check Obstacle Collisions
      for (let obs of obstacles) {
        const distZ = Math.abs(ball.position.z - obs.position.z);
        const distX = Math.abs(ball.position.x - obs.position.x);
        if (distZ < 1.2 && distX < 1.2) {
          triggerGameOver();
        }
      }

      renderer.render(scene, camera);
    }

    function triggerGameOver() {
      isGameOver = true;
      document.getElementById('final-score').innerText = score;
      document.getElementById('game-over').style.display = 'flex';
    }

    function resetGame() {
      // Clean scene
      tiles.forEach(t => scene.remove(t));
      obstacles.forEach(o => scene.remove(o));
      tiles = [];
      obstacles = [];

      ball.position.set(0, 0.8, 0);
      speed = 0.6;
      score = 0;
      isGameOver = false;

      document.getElementById('game-over').style.display = 'none';

      for (let i = 0; i < 40; i++) {
        spawnTile(i * -5);
      }

      animate();
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.onload = init;
  </script>
</body>
</html>
