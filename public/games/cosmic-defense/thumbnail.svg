<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-cosmic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050614"/>
      <stop offset="100%" stop-color="#19072e"/>
    </linearGradient>
    <filter id="glow-purple-lg" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Starry Background -->
  <rect width="600" height="400" fill="url(#bg-cosmic)"/>
  <circle cx="80" cy="60" r="1.5" fill="#fff" opacity="0.8"/>
  <circle cx="200" cy="140" r="2" fill="#fff" opacity="0.6"/>
  <circle cx="480" cy="90" r="1" fill="#fff" opacity="0.9"/>
  <circle cx="530" cy="220" r="2" fill="#fff" opacity="0.7"/>
  <circle cx="120" cy="280" r="1.5" fill="#fff" opacity="0.5"/>

  <!-- Enemy Waves -->
  <circle cx="200" cy="100" r="16" fill="#f43f5e" filter="url(#glow-purple-lg)"/>
  <circle cx="300" cy="70" r="20" fill="#fb923c" filter="url(#glow-purple-lg)"/>
  <circle cx="400" cy="110" r="15" fill="#eab308" filter="url(#glow-purple-lg)"/>

  <!-- Plasma Lasers -->
  <line x1="285" y1="220" x2="285" y2="140" stroke="#a855f7" stroke-width="6" stroke-linecap="round" filter="url(#glow-purple-lg)"/>
  <line x1="315" y1="220" x2="315" y2="140" stroke="#a855f7" stroke-width="6" stroke-linecap="round" filter="url(#glow-purple-lg)"/>

  <!-- Hero Starship -->
  <polygon points="300,210 270,260 330,260" fill="#38bdf8" filter="url(#glow-blue)"/>

  <!-- Title Text -->
  <text x="300" y="340" text-anchor="middle" fill="#a855f7" font-family="system-ui, sans-serif" font-weight="900" font-size="32" letter-spacing="4" filter="url(#glow-purple-lg)">COSMIC DEFENSE</text>
  <text x="300" y="370" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="600" font-size="14" letter-spacing="2">GALACTIC SHOOTER</text>
</svg>
