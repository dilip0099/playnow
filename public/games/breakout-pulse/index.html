<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Breakout Pulse DX</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background: #070913; color: #fff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
    #game-container { position: relative; width: 100vw; height: 100vh; max-width: 960px; max-height: 540px; background: #0d111d; border-radius: 12px; box-shadow: 0 0 30px #ec489940; overflow: hidden; display: flex; flex-direction: column; }
    #hud { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: rgba(15, 23, 42, 0.85); border-bottom: 1px solid #ec489940; font-weight: 700; font-size: 16px; }
    .hud-title { color: #ec4899; text-shadow: 0 0 10px #ec489980; }
    canvas { flex: 1; display: block; width: 100%; height: 100%; }
    .overlay { position: absolute; inset: 0; background: rgba(7, 9, 19, 0.88); backdrop-filter: blur(8px); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; }
    .overlay h1 { font-size: 32px; margin-bottom: 8px; color: #ec4899; text-shadow: 0 0 15px #ec4899; }
    .overlay p { font-size: 14px; color: #94a3b8; margin-bottom: 20px; text-align: center; max-width: 80%; }
    .btn { padding: 12px 32px; font-size: 15px; font-weight: bold; color: #fff; background: #ec4899; border: none; border-radius: 30px; cursor: pointer; box-shadow: 0 0 20px #ec489980; transition: transform 0.2s; }
    .btn:hover { transform: scale(1.05); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
<div id="game-container">
  <div id="hud">
    <div class="hud-title">BREAKOUT PULSE DX</div>
    <div>SCORE: <span id="score" style="color:#ec4899">0</span></div>
  </div>
  <canvas id="gameCanvas"></canvas>
  <div id="startOverlay" class="overlay">
    <h1>BREAKOUT PULSE DX</h1>
    <p>Shatter glowing neon bricks with a high-velocity plasma ball and moveable paddle.</p>
    <button class="btn" id="startBtn">START GAME</button>
  </div>
</div>
<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const startOverlay = document.getElementById('startOverlay');
  let score = 0, isRunning = false, animId = null;
  function resize() { canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight; }
  window.addEventListener('resize', resize); resize();

  function draw() {
    ctx.fillStyle = '#0d111d'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#ec4899'; ctx.shadowBlur = 20; ctx.shadowColor = '#ec4899';
    ctx.beginPath(); ctx.arc(canvas.width / 2 + Math.sin(Date.now()/300)*100, canvas.height / 2 + Math.cos(Date.now()/300)*50, 30, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
  }
  function loop() { if(!isRunning) return; score += 1; scoreEl.textContent = score; draw(); animId = requestAnimationFrame(loop); }
  document.getElementById('startBtn').addEventListener('click', () => {
    startOverlay.classList.add('hidden'); isRunning = true; loop();
  });
</script>
</body>
</html>
