<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Snake 3D Retro - PlayThorn</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #fff;
      font-family: system-ui, sans-serif;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 360px;
      margin-bottom: 12px;
      font-weight: bold;
    }
    canvas {
      background: #1e293b;
      border-radius: 12px;
      border: 3px solid #334155;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      touch-action: none;
    }
    .hint { margin-top: 12px; font-size: 14px; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="hud">
    <div>SCORE: <span id="s">0</span></div>
    <div>BEST: <span id="b">0</span></div>
  </div>
  <canvas id="c" width="360" height="360"></canvas>
  <div class="hint">Use <b>WASD</b>, <b>Arrow Keys</b>, or <b>Swipe</b></div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const grid = 18;
    const count = canvas.width / grid;

    let score = 0;
    let best = localStorage.getItem('snake_b') || 0;
    document.getElementById('b').innerText = best;

    let snake = [{ x: 10, y: 10 }];
    let dx = 1, dy = 0;
    let food = { x: 15, y: 15 };
    let gameOver = false;

    function placeFood() {
      food.x = Math.floor(Math.random() * count);
      food.y = Math.floor(Math.random() * count);
    }

    function reset() {
      snake = [{ x: 10, y: 10 }];
      dx = 1; dy = 0;
      score = 0;
      document.getElementById('s').innerText = score;
      gameOver = false;
      placeFood();
    }

    window.addEventListener('keydown', e => {
      if (gameOver) { reset(); return; }
      if (e.key === 'ArrowLeft' || e.key === 'a') { if (dx !== 1) { dx = -1; dy = 0; } }
      else if (e.key === 'ArrowRight' || e.key === 'd') { if (dx !== -1) { dx = 1; dy = 0; } }
      else if (e.key === 'ArrowUp' || e.key === 'w') { if (dy !== 1) { dx = 0; dy = -1; } }
      else if (e.key === 'ArrowDown' || e.key === 's') { if (dy !== -1) { dx = 0; dy = 1; } }
    });

    let touchX, touchY;
    canvas.addEventListener('touchstart', e => {
      touchX = e.touches[0].clientX;
      touchY = e.touches[0].clientY;
    });
    canvas.addEventListener('touchend', e => {
      if (gameOver) { reset(); return; }
      let ex = e.changedTouches[0].clientX;
      let ey = e.changedTouches[0].clientY;
      let diffX = ex - touchX;
      let diffY = ey - touchY;
      if (Math.abs(diffX) > Math.abs(diffY)) {
        if (diffX > 20 && dx !== -1) { dx = 1; dy = 0; }
        else if (diffX < -20 && dx !== 1) { dx = -1; dy = 0; }
      } else {
        if (diffY > 20 && dy !== -1) { dx = 0; dy = 1; }
        else if (diffY < -20 && dy !== 1) { dx = 0; dy = -1; }
      }
    });

    function update() {
      if (gameOver) return;

      let head = { x: snake[0].x + dx, y: snake[0].y + dy };

      // Wall collision
      if (head.x < 0 || head.x >= count || head.y < 0 || head.y >= count) {
        gameOver = true;
      }

      // Self collision
      for (let i = 0; i < snake.length; i++) {
        if (snake[i].x === head.x && snake[i].y === head.y) gameOver = true;
      }

      if (gameOver) {
        if (score > best) {
          best = score;
          localStorage.setItem('snake_b', best);
          document.getElementById('b').innerText = best;
        }
        return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        document.getElementById('s').innerText = score;
        placeFood();
      } else {
        snake.pop();
      }
    }

    function draw() {
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid background lines
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 0.5;
      for (let i = 0; i < count; i++) {
        ctx.beginPath(); ctx.moveTo(i * grid, 0); ctx.lineTo(i * grid, canvas.height); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i * grid); ctx.lineTo(canvas.width, i * grid); ctx.stroke();
      }

      // Food
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc((food.x + 0.5) * grid, (food.y + 0.5) * grid, grid / 2.5, 0, Math.PI * 2);
      ctx.fill();

      // Snake
      snake.forEach((part, idx) => {
        ctx.fillStyle = idx === 0 ? '#10b981' : '#34d399';
        ctx.fillRect(part.x * grid + 1, part.y * grid + 1, grid - 2, grid - 2);
      });

      if (gameOver) {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ef4444';
        ctx.font = 'bold 30px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, 170);
        ctx.fillStyle = '#38bdf8';
        ctx.font = '16px sans-serif';
        ctx.fillText('Press any key or Tap to play again', canvas.width / 2, 210);
      }
    }

    setInterval(() => {
      update();
      draw();
    }, 110);
  </script>
</body>
</html>
