<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913"/>
      <stop offset="100%" stop-color="#19153a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <circle cx="300" cy="160" r="50" fill="#e11d48" opacity="0.4" filter="url(#glow)"/>
  <text x="300" y="175" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="44">🎮</text>
  <text x="300" y="290" text-anchor="middle" fill="#e11d48" font-family="sans-serif" font-weight="900" font-size="26" letter-spacing="2" filter="url(#glow)">HYPER DRIFT GRAND PRIX</text>
  <text x="300" y="325" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-weight="600" font-size="14" letter-spacing="1">RACING • BSD-2</text>
</svg>