<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Memory Quest</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #080711;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 960px;
      max-height: 540px;
      background: #0d0b1d;
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(236, 72, 153, 0.3);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    #hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px;
      background: rgba(15, 23, 42, 0.85);
      border-bottom: 1px solid rgba(236, 72, 153, 0.3);
      font-weight: 700;
      font-size: 16px;
    }
    .hud-title { color: #ec4899; text-shadow: 0 0 10px rgba(236, 72, 153, 0.6); }
    .hud-val { color: #f97316; }
    #board-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    #grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 480px;
      aspect-ratio: 4 / 3;
    }
    .card {
      background: transparent;
      perspective: 1000px;
      cursor: pointer;
    }
    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
      border-radius: 8px;
    }
    .card.flipped .card-inner {
      transform: rotateY(180deg);
    }
    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: bold;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .card-front {
      background: linear-gradient(135deg, #1e1b4b, #312e81);
      color: #ec4899;
      box-shadow: inset 0 0 15px rgba(236, 72, 153, 0.2);
    }
    .card-front::after {
      content: '✦';
      font-size: 20px;
      color: rgba(236, 72, 153, 0.5);
    }
    .card-back {
      background: linear-gradient(135deg, #831843, #be185d);
      color: #fff;
      transform: rotateY(180deg);
      box-shadow: 0 0 15px rgba(236, 72, 153, 0.5);
    }
    .card.matched .card-back {
      background: linear-gradient(135deg, #065f46, #059669);
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.6);
    }
    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(8, 7, 17, 0.88);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .overlay h1 { font-size: 38px; margin-bottom: 10px; background: linear-gradient(135deg, #ec4899, #f97316); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .overlay p { font-size: 16px; color: #94a3b8; margin-bottom: 24px; text-align: center; max-width: 80%; }
    .btn {
      padding: 12px 32px;
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(135deg, #ec4899, #f97316);
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(236, 72, 153, 0.6);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(236, 72, 153, 0.9); }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div id="game-container">
  <div id="hud">
    <div class="hud-title">PIXEL MEMORY</div>
    <div>MOVES: <span id="moves" class="hud-val">0</span></div>
    <div>TIME: <span id="timer" class="hud-val">0s</span></div>
  </div>

  <div id="board-wrapper">
    <div id="grid"></div>
  </div>

  <div id="startOverlay" class="overlay">
    <h1>PIXEL MEMORY QUEST</h1>
    <p>Match all glyph pairs in the fewest moves possible.</p>
    <button class="btn" id="startBtn">BEGIN QUEST</button>
  </div>

  <div id="victoryOverlay" class="overlay hidden">
    <h1>PUZZLE CLEARED!</h1>
    <p>Completed in <span id="finalTime" style="color:#f97316; font-weight:bold;">0s</span> with <span id="finalMoves" style="color:#ec4899; font-weight:bold;">0</span> moves.</p>
    <button class="btn" id="restartBtn">PLAY AGAIN</button>
  </div>
</div>

<script>
  const SYMBOLS = ['⚡', '💎', '🔥', '🌀', '✦', '🚀'];
  const grid = document.getElementById('grid');
  const movesEl = document.getElementById('moves');
  const timerEl = document.getElementById('timer');
  const finalTimeEl = document.getElementById('finalTime');
  const finalMovesEl = document.getElementById('finalMoves');
  const startOverlay = document.getElementById('startOverlay');
  const victoryOverlay = document.getElementById('victoryOverlay');

  let cards = [];
  let flippedCards = [];
  let matchedPairs = 0;
  let moves = 0;
  let seconds = 0;
  let timerInterval = null;
  let isLock = false;

  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playSound(freq, duration = 0.1) {
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
  }

  function initBoard() {
    grid.innerHTML = '';
    const deck = [...SYMBOLS, ...SYMBOLS].sort(() => Math.random() - 0.5);
    cards = [];
    flippedCards = [];
    matchedPairs = 0;
    moves = 0;
    seconds = 0;
    movesEl.textContent = moves;
    timerEl.textContent = '0s';

    deck.forEach((sym, index) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.symbol = sym;
      card.dataset.index = index;

      card.innerHTML = `
        <div class="card-inner">
          <div class="card-face card-front"></div>
          <div class="card-face card-back">${sym}</div>
        </div>
      `;

      card.addEventListener('click', () => onCardClick(card));
      grid.appendChild(card);
      cards.push(card);
    });
  }

  function onCardClick(card) {
    if (isLock || card.classList.contains('flipped') || card.classList.contains('matched')) return;

    playSound(350, 0.08);
    card.classList.add('flipped');
    flippedCards.push(card);

    if (flippedCards.length === 2) {
      moves++;
      movesEl.textContent = moves;
      checkMatch();
    }
  }

  function checkMatch() {
    isLock = true;
    const [c1, c2] = flippedCards;
    if (c1.dataset.symbol === c2.dataset.symbol) {
      playSound(600, 0.15);
      c1.classList.add('matched');
      c2.classList.add('matched');
      matchedPairs++;
      flippedCards = [];
      isLock = false;

      if (matchedPairs === SYMBOLS.length) {
        clearInterval(timerInterval);
        playSound(800, 0.3);
        finalTimeEl.textContent = seconds + 's';
        finalMovesEl.textContent = moves;
        victoryOverlay.classList.remove('hidden');
      }
    } else {
      setTimeout(() => {
        c1.classList.remove('flipped');
        c2.classList.remove('flipped');
        flippedCards = [];
        isLock = false;
      }, 800);
    }
  }

  function startGame() {
    initBoard();
    startOverlay.classList.add('hidden');
    victoryOverlay.classList.add('hidden');
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      seconds++;
      timerEl.textContent = seconds + 's';
    }, 1000);
  }

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('restartBtn').addEventListener('click', startGame);
</script>
</body>
</html>
