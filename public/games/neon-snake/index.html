<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Snake Cyberpulse</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #05070f;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 960px;
      max-height: 540px;
      background: #090d16;
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    #hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background: rgba(15, 23, 42, 0.8);
      border-bottom: 1px solid rgba(0, 240, 255, 0.2);
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 1px;
    }
    .hud-title { color: #00f0ff; text-shadow: 0 0 10px rgba(0, 240, 255, 0.5); }
    .hud-val { color: #9d4edd; text-shadow: 0 0 10px rgba(157, 78, 221, 0.5); }
    canvas { flex: 1; display: block; width: 100%; height: 100%; }
    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(5, 7, 15, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .overlay h1 { font-size: 36px; margin-bottom: 10px; background: linear-gradient(135deg, #00f0ff, #9d4edd); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .overlay p { font-size: 16px; color: #94a3b8; margin-bottom: 24px; text-align: center; max-width: 80%; }
    .btn {
      padding: 12px 32px;
      font-size: 16px;
      font-weight: bold;
      color: #05070f;
      background: #00f0ff;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(0, 240, 255, 0.9); }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div id="game-container">
  <div id="hud">
    <div class="hud-title">NEON SNAKE</div>
    <div>SCORE: <span id="score" class="hud-val">0</span></div>
    <div>HIGH SCORE: <span id="highScore" class="hud-val">0</span></div>
  </div>
  <canvas id="gameCanvas"></canvas>

  <div id="startOverlay" class="overlay">
    <h1>NEON SNAKE CYBERPULSE</h1>
    <p>Use Arrow Keys or WASD to navigate the grid and collect energy cores.</p>
    <button class="btn" id="startBtn">START GAME</button>
  </div>

  <div id="gameOverOverlay" class="overlay hidden">
    <h1 style="background: linear-gradient(135deg, #ff007f, #ffb703); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">SYSTEM OVERLOAD</h1>
    <p>Final Score: <span id="finalScore" style="color:#00f0ff; font-weight:bold;">0</span></p>
    <button class="btn" id="restartBtn">TRY AGAIN</button>
  </div>
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const highScoreEl = document.getElementById('highScore');
  const finalScoreEl = document.getElementById('finalScore');
  const startOverlay = document.getElementById('startOverlay');
  const gameOverOverlay = document.getElementById('gameOverOverlay');

  let highScore = parseInt(localStorage.getItem('neon_snake_highscore') || '0');
  highScoreEl.textContent = highScore;

  const GRID_SIZE = 20;
  let cols, rows;
  let snake = [];
  let dir = { x: 1, y: 0 };
  let nextDir = { x: 1, y: 0 };
  let food = { x: 0, y: 0 };
  let score = 0;
  let particles = [];
  let gameInterval = null;
  let isRunning = false;
  let speed = 110;

  // Web Audio Synth
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playSound(freq, type = 'sine', duration = 0.1) {
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
  }

  function resize() {
    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;
    cols = Math.floor(canvas.width / GRID_SIZE);
    rows = Math.floor(canvas.height / GRID_SIZE);
  }
  window.addEventListener('resize', resize);
  resize();

  function spawnFood() {
    food = {
      x: Math.floor(Math.random() * (cols - 2)) + 1,
      y: Math.floor(Math.random() * (rows - 2)) + 1
    };
  }

  function spawnParticles(x, y, color) {
    for (let i = 0; i < 12; i++) {
      particles.push({
        x: x * GRID_SIZE + GRID_SIZE / 2,
        y: y * GRID_SIZE + GRID_SIZE / 2,
        vx: (Math.random() - 0.5) * 6,
        vy: (Math.random() - 0.5) * 6,
        color: color,
        life: 1,
        decay: Math.random() * 0.05 + 0.02
      });
    }
  }

  function initGame() {
    resize();
    snake = [
      { x: Math.floor(cols / 2), y: Math.floor(rows / 2) },
      { x: Math.floor(cols / 2) - 1, y: Math.floor(rows / 2) },
      { x: Math.floor(cols / 2) - 2, y: Math.floor(rows / 2) }
    ];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    speed = 110;
    scoreEl.textContent = score;
    spawnFood();
    particles = [];
  }

  function update() {
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // Wall collision
    if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows) {
      return gameOver();
    }

    // Self collision
    for (let seg of snake) {
      if (seg.x === head.x && seg.y === head.y) {
        return gameOver();
      }
    }

    snake.unshift(head);

    // Food collision
    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      if (score > highScore) {
        highScore = score;
        highScoreEl.textContent = highScore;
        localStorage.setItem('neon_snake_highscore', highScore.toString());
      }
      playSound(587.33, 'square', 0.15); // D5
      spawnParticles(food.x, food.y, '#00f0ff');
      spawnFood();
      if (speed > 50) speed -= 2;
      clearInterval(gameInterval);
      gameInterval = setInterval(gameLoop, speed);
    } else {
      snake.pop();
    }

    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life -= p.decay;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  function draw() {
    ctx.fillStyle = '#090d16';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Draw Grid
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.05)';
    ctx.lineWidth = 1;
    for (let c = 0; c < cols; c++) {
      ctx.beginPath();
      ctx.moveTo(c * GRID_SIZE, 0);
      ctx.lineTo(c * GRID_SIZE, canvas.height);
      ctx.stroke();
    }
    for (let r = 0; r < rows; r++) {
      ctx.beginPath();
      ctx.moveTo(0, r * GRID_SIZE);
      ctx.lineTo(canvas.width, r * GRID_SIZE);
      ctx.stroke();
    }

    // Draw Food
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#00f0ff';
    ctx.fillStyle = '#00f0ff';
    ctx.beginPath();
    ctx.arc(food.x * GRID_SIZE + GRID_SIZE / 2, food.y * GRID_SIZE + GRID_SIZE / 2, GRID_SIZE / 2 - 2, 0, Math.PI * 2);
    ctx.fill();

    // Draw Snake
    snake.forEach((seg, index) => {
      ctx.shadowBlur = index === 0 ? 20 : 10;
      ctx.shadowColor = index === 0 ? '#9d4edd' : '#00f0ff';
      ctx.fillStyle = index === 0 ? '#9d4edd' : '#00f0ff';
      ctx.fillRect(seg.x * GRID_SIZE + 1, seg.y * GRID_SIZE + 1, GRID_SIZE - 2, GRID_SIZE - 2);
    });

    // Draw Particles
    particles.forEach(p => {
      ctx.shadowBlur = 10;
      ctx.shadowColor = p.color;
      ctx.fillStyle = p.color;
      ctx.globalAlpha = p.life;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1.0;
    });

    ctx.shadowBlur = 0;
  }

  function gameLoop() {
    update();
    draw();
  }

  function startGame() {
    initGame();
    startOverlay.classList.add('hidden');
    gameOverOverlay.classList.add('hidden');
    isRunning = true;
    if (gameInterval) clearInterval(gameInterval);
    gameInterval = setInterval(gameLoop, speed);
  }

  function gameOver() {
    isRunning = false;
    clearInterval(gameInterval);
    playSound(150, 'sawtooth', 0.4);
    finalScoreEl.textContent = score;
    gameOverOverlay.classList.remove('hidden');
  }

  window.addEventListener('keydown', e => {
    if (!isRunning) return;
    switch (e.key) {
      case 'ArrowUp': case 'w': case 'W':
        if (dir.y === 0) nextDir = { x: 0, y: -1 };
        break;
      case 'ArrowDown': case 's': case 'S':
        if (dir.y === 0) nextDir = { x: 0, y: 1 };
        break;
      case 'ArrowLeft': case 'a': case 'A':
        if (dir.x === 0) nextDir = { x: -1, y: 0 };
        break;
      case 'ArrowRight': case 'd': case 'D':
        if (dir.x === 0) nextDir = { x: 1, y: 0 };
        break;
    }
  });

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('restartBtn').addEventListener('click', startGame);
</script>
</body>
</html>
