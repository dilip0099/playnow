<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050715"/>
      <stop offset="100%" stop-color="#120c24"/>
    </linearGradient>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bg)"/>

  <!-- Cyber Grid -->
  <path d="M0 50 H600 M0 100 H600 M0 150 H600 M0 200 H600 M0 250 H600 M0 300 H600 M0 350 H600" stroke="#00f0ff" stroke-opacity="0.08" stroke-width="1"/>
  <path d="M50 0 V400 M100 0 V400 M150 0 V400 M200 0 V400 M250 0 V400 M300 0 V400 M350 0 V400 M400 0 V400 M450 0 V400 M500 0 V400 M550 0 V400" stroke="#00f0ff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Snake Trail -->
  <path d="M 100 250 H 300 V 150 H 450" fill="none" stroke="#00f0ff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-cyan)"/>
  
  <!-- Snake Head -->
  <rect x="435" y="135" width="30" height="30" rx="6" fill="#9d4edd" filter="url(#glow-purple)"/>

  <!-- Glowing Food -->
  <circle cx="520" cy="150" r="16" fill="#ff007f" filter="url(#glow-cyan)"/>

  <!-- Title Text -->
  <text x="300" y="340" text-anchor="middle" fill="#00f0ff" font-family="system-ui, sans-serif" font-weight="900" font-size="32" letter-spacing="4" filter="url(#glow-cyan)">NEON SNAKE</text>
  <text x="300" y="370" text-anchor="middle" fill="#9d4edd" font-family="system-ui, sans-serif" font-weight="600" font-size="14" letter-spacing="2">CYBERPULSE EDITION</text>
</svg>
