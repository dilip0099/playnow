<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>2048 Classic - PlayThorn</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 400px;
      margin-bottom: 16px;
    }
    .title { font-size: 36px; font-weight: 900; color: #f59e0b; }
    .scores { display: flex; gap: 12px; }
    .score-box {
      background: #1e293b;
      padding: 8px 16px;
      border-radius: 8px;
      text-align: center;
      border: 1px solid #334155;
    }
    .score-label { font-size: 10px; color: #94a3b8; text-transform: uppercase; font-weight: 700; }
    .score-val { font-size: 18px; font-weight: 800; color: #fff; }

    #board {
      width: 100%;
      max-width: 400px;
      height: 400px;
      background: #1e293b;
      border-radius: 12px;
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 12px;
      position: relative;
      border: 2px solid #334155;
      touch-action: none;
    }
    .cell {
      background: #334155;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 800;
      color: #f8fafc;
      transition: all 0.15s ease-in-out;
    }
    .t-2 { background: #38bdf8; color: #0f172a; }
    .t-4 { background: #818cf8; color: #fff; }
    .t-8 { background: #f59e0b; color: #fff; }
    .t-16 { background: #f97316; color: #fff; }
    .t-32 { background: #ef4444; color: #fff; }
    .t-64 { background: #ec4899; color: #fff; }
    .t-128 { background: #a855f7; color: #fff; font-size: 24px; }
    .t-256 { background: #06b6d4; color: #fff; font-size: 24px; }
    .t-512 { background: #10b981; color: #fff; font-size: 24px; }
    .t-1024 { background: #eab308; color: #fff; font-size: 20px; }
    .t-2048 { background: #f43f5e; color: #fff; font-size: 20px; box-shadow: 0 0 20px #f43f5e; }

    .controls-hint {
      margin-top: 16px;
      color: #64748b;
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">2048</div>
    <div class="scores">
      <div class="score-box">
        <div class="score-label">SCORE</div>
        <div class="score-val" id="score">0</div>
      </div>
      <div class="score-box">
        <div class="score-label">BEST</div>
        <div class="score-val" id="best">0</div>
      </div>
    </div>
  </div>

  <div id="board"></div>

  <div class="controls-hint">Use <b>Arrow Keys</b> or <b>Swipe</b> to play</div>

  <script>
    const SIZE = 4;
    let grid = Array(SIZE).fill(null).map(() => Array(SIZE).fill(0));
    let score = 0;
    let best = localStorage.getItem('2048_best') || 0;
    document.getElementById('best').innerText = best;

    function init() {
      grid = Array(SIZE).fill(null).map(() => Array(SIZE).fill(0));
      score = 0;
      updateScore(0);
      addRandom();
      addRandom();
      render();
    }

    function addRandom() {
      let empty = [];
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (grid[r][c] === 0) empty.push({ r, c });
        }
      }
      if (empty.length > 0) {
        let spot = empty[Math.floor(Math.random() * empty.length)];
        grid[spot.r][spot.c] = Math.random() < 0.9 ? 2 : 4;
      }
    }

    function render() {
      const board = document.getElementById('board');
      board.innerHTML = '';
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          let val = grid[r][c];
          let div = document.createElement('div');
          div.className = 'cell ' + (val ? 't-' + val : '');
          div.innerText = val ? val : '';
          board.appendChild(div);
        }
      }
    }

    function updateScore(pts) {
      score += pts;
      document.getElementById('score').innerText = score;
      if (score > best) {
        best = score;
        localStorage.setItem('2048_best', best);
        document.getElementById('best').innerText = best;
      }
    }

    function slide(row) {
      let arr = row.filter(val => val);
      let missing = SIZE - arr.length;
      let zeros = Array(missing).fill(0);
      return arr.concat(zeros);
    }

    function combine(row) {
      for (let i = 0; i < SIZE - 1; i++) {
        if (row[i] !== 0 && row[i] === row[i + 1]) {
          row[i] *= 2;
          updateScore(row[i]);
          row[i + 1] = 0;
        }
      }
      return row;
    }

    function moveLeft() {
      let moved = false;
      for (let r = 0; r < SIZE; r++) {
        let old = [...grid[r]];
        let row = slide(grid[r]);
        row = combine(row);
        row = slide(row);
        grid[r] = row;
        if (JSON.stringify(old) !== JSON.stringify(row)) moved = true;
      }
      return moved;
    }

    function rotate() {
      let next = Array(SIZE).fill(null).map(() => Array(SIZE).fill(0));
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          next[c][SIZE - 1 - r] = grid[r][c];
        }
      }
      grid = next;
    }

    function move(dir) {
      let moved = false;
      if (dir === 'left') moved = moveLeft();
      else if (dir === 'right') { rotate(); rotate(); moved = moveLeft(); rotate(); rotate(); }
      else if (dir === 'up') { rotate(); rotate(); rotate(); moved = moveLeft(); rotate(); }
      else if (dir === 'down') { rotate(); moved = moveLeft(); rotate(); rotate(); rotate(); }

      if (moved) {
        addRandom();
        render();
      }
    }

    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') move('left');
      else if (e.key === 'ArrowRight') move('right');
      else if (e.key === 'ArrowUp') move('up');
      else if (e.key === 'ArrowDown') move('down');
    });

    let startX, startY;
    const board = document.getElementById('board');
    board.addEventListener('touchstart', e => {
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
    });
    board.addEventListener('touchend', e => {
      if (!startX || !startY) return;
      let dx = e.changedTouches[0].clientX - startX;
      let dy = e.changedTouches[0].clientY - startY;
      if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 30) move('right');
        else if (dx < -30) move('left');
      } else {
        if (dy > 30) move('down');
        else if (dy < -30) move('up');
      }
    });

    init();
  </script>
</body>
</html>
